<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Finance<span>AI</span></div>
    </nav>

    <p id="confirmation-message" class="confirmation-message"></p>

    <div class="dashboard">
        <h2>Select Your Housing Type</h2>
        <div class="grid-container">
            <div class="card" onclick="selectOption('Owned House', 'OwnedHouse')">
                <div class="card-content">
                    <img src="{{ url_for('static', filename='images/owned_house.jpg') }}" alt="Owned House" loading="lazy">
                    <h3>Owned House</h3>
                    <p>Best for long-term residents.</p>
                </div>
            </div>
            <div class="card" onclick="selectOption('Rented House', 'RentedHouse')">
                <div class="card-content">
                    <img src="{{ url_for('static', filename='images/rented_house.jpg') }}" alt="Rented House" loading="lazy">
                    <h3>Rented House</h3>
                    <p>Flexible living with lease options.</p>
                </div>
            </div>
            <div class="card" onclick="selectOption('General', 'General')">
                <div class="card-content">
                    <img src="{{ url_for('static', filename='images/general.jpg') }}" alt="General" loading="lazy">
                    <h3>General</h3>
                    <p>Other housing choices.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Housing Choice. All Rights Reserved.</p>
    </footer>

    <script>
        function selectOption(option, type) {
            fetch('/dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ selected: option })
            })
            .then(response => response.json())
            .then(data => {
                if (type === 'OwnedHouse') {
                    window.location.href = "/form_owned";  // Change to Flask route
                } else if (type === 'RentedHouse') {
                    window.location.href = "/form_rented";
                } else {
                    window.location.href = "/form_general";
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
