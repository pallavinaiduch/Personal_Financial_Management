<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Finance<span>AI</span></div>
    </nav>
    
    <div class="form-container">
        <h2>General Expenses</h2>
        <form action="/submit_general" method="POST">

            <div class="form-group">
                <label for="income">Income:</label>
                <input type="number" id="income" name="income" required>
            </div>
            
            <div class="form-group">
                <label for="internet">Internet & Mobile Bill:</label>
                <input type="number" id="internet" name="internet" required>
            </div>
            
            <div class="form-group">
                <label for="groceries">Grocery Expenses:</label>
                <input type="number" id="groceries" name="groceries" required>
            </div>
            
            <div class="form-group">
                <label for="entertainment">Entertainment:</label>
                <input type="number" id="entertainment" name="entertainment" required>
            </div>
            
            <div class="form-group">
                <label for="transportation">Transportation:</label>
                <input type="number" id="transportation" name="transportation" required>
            </div>

            <div class="form-group">
                <label for="shopping">Shopping:</label>
                <input type="number" id="shopping" name="shopping" required>
            </div>

            <div class="form-group">
                <label for="medical">Medical / Health Expenses:</label>
                <input type="number" id="medical" name="medical" required>
            </div>

            <div class="form-group">
                <label for="subscriptions">Subscriptions (Netflix, Spotify, Gym, etc.):</label>
                <input type="number" id="subscriptions" name="subscriptions" required>
            </div>

            <div class="form-group">
                <label for="miscellaneous">Other Miscellaneous Expenses:</label>
                <input type="number" id="miscellaneous" name="miscellaneous" required>
            </div>
            
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
