<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spending Category</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d1f21, #373737);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 1rem;
        }

        .navbar {
            width: 100%;
            background: #1f1f1f;
            padding: 1rem 3rem;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #00e7ff;
        }

        .navbar .logo span {
            color: #6fdd5f;
        }

        .content {
            margin-top: 8rem;
            text-align: center;
        }

        h2 {
            color: #6fdd5f;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee {
            display: inline-block;
            animation: marquee 6s linear infinite;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00e7ff;
            text-shadow: 0px 0px 10px rgba(0, 231, 255, 0.8);
        }

        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        .overview-btn {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #00e7ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background 0.3s ease-in-out;
            color: #000;
        }

        .overview-btn:hover {
            background: #6fdd5f;
        }

        #advice-box {
            background: #222;
            border-left: 5px solid #00e7ff;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            max-width: 80%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 231, 255, 0.3);
            text-align: left;
            display: flex;
            align-items: center;
        }
        
        #advice-box i {
            font-size: 1.5rem;
            margin-right: 10px;
            color: #6fdd5f;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Finance<span>AI</span></div>
    </div>

    <div class="content">
        <h2>Your Spending Category</h2>
        <div class="marquee-container">
            <div id="spenderCategory" class="marquee"></div>
        </div>
    </div>

    <div id="advice-box">
        <p>{{ advice }}</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let adviceBox = document.getElementById("advice-box");
            if (adviceBox.innerHTML.trim() === "") {
                adviceBox.innerHTML = "<p>No advice available at the moment.</p>";
            }
        });

        function classifySpender(expenses, income) {
            let percentage = (expenses / income) * 100;
            if (percentage <= 30) return "Low Spender";
            if (percentage <= 70) return "Medium Spender";
            return "High Spender";
        }

        function fetchAdvice(category) {
            fetch('/get_advice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category: category })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('advice-box').innerHTML = `
                    <i class="fas fa-lightbulb"></i> ${data.advice}
                `;
            })
            .catch(error => console.error('Error fetching advice:', error));
        }
    
        window.onload = function() {
            fetchAdvice("{{ spender_category }}");
        };

        let expenses = parseFloat(sessionStorage.getItem("expenses")) || 0;
        let income = parseFloat(sessionStorage.getItem("income")) || 1;

        let spenderCategory = classifySpender(expenses, income);
        sessionStorage.setItem("spenderCategory", spenderCategory);

        document.getElementById("spenderCategory").innerText = "You are a {{ spender_category }}!";

        function goToOverview() {
            window.location.href = "overview.html";
        }
    </script>
</body>
</html>
